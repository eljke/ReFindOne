name: Build iOS IPA (LiveContainer)

# Manual launch saves macOS minutes on private repositories.
on:
  workflow_dispatch:
    inputs:
      publish_run:
        description: 'Retry delivery from this run ID; its iPhone build and tests must have passed'
        type: string
        required: false
      release_tag:
        description: 'Existing release tag matching that run (for delivery retry only)'
        type: string
        required: false
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    if: inputs.publish_run == ''
    name: Xcode 27 / iPhoneOS / unsigned IPA
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Fetch sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check generated project and release version
        run: |
          python3 tools/generate_xcodeproj.py
          git diff --exit-code -- ReFindOne.xcodeproj/project.pbxproj
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          fi

      - name: Run core behavior tests
        run: swift test -j 2 -Xswiftc -strict-concurrency=complete

      - name: Display build environment
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build for physical iPhone and package IPA
        run: bash tools/build_unsigned_ipa_macos.sh

      - name: Verify IPA structure and device architecture
        run: python3 tools/verify_ipa.py build/ReFindOne-unsigned.ipa

      - name: Compute SHA-256
        run: shasum -a 256 build/ReFindOne-unsigned.ipa | tee build/SHA256.txt

      - name: Test iPhone interface
        run: |
          xcodebuild -project ReFindOne.xcodeproj -scheme ReFindOne \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 18 Pro Max,OS=27.0' \
            -derivedDataPath build/UITestDerived -resultBundlePath build/UITests.xcresult \
            CODE_SIGNING_ALLOWED=NO test

      - name: Export interface screenshots
        if: always()
        run: |
          if [[ -d build/UITests.xcresult ]]; then
            xcrun xcresulttool export attachments --path build/UITests.xcresult --output-path build/screenshots
          fi

      - name: Publish interface screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ReFindOne-interface
          path: build/screenshots
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish unsigned IPA
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ReFindOne-unsigned-iOS27
          path: |
            build/ReFindOne-unsigned.ipa
            build/SHA256.txt
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Release and GitHub Package
    if: >-
      always() && !cancelled() &&
      ((startsWith(github.ref, 'refs/tags/v') && needs['build-unsigned-ipa'].result == 'success') ||
       (inputs.publish_run != '' && inputs.release_tag != ''))
    needs: build-unsigned-ipa
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      SOURCE_RUN: ${{ inputs.publish_run || github.run_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Verify source run matches the tag and passed all build checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          SOURCE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .head_sha)
          test "$SOURCE_SHA" = "$(git rev-parse HEAD)"
          RESULT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs" \
            --jq '.jobs[] | select(.name == "Xcode 27 / iPhoneOS / unsigned IPA") | .conclusion')
          test "$RESULT" = success
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ReFindOne-unsigned-iOS27
          path: build
          run-id: ${{ inputs.publish_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2
        with:
          version: 1.3.0
      - name: Publish and verify versioned IPA package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(cat VERSION)
          test "$RELEASE_TAG" = "v$VERSION"
          cd build
          FILE="ReFindOne-${VERSION}-unsigned.ipa"
          mv ReFindOne-unsigned.ipa "$FILE"
          sha256sum "$FILE" > SHA256SUMS.txt
          PACKAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if oras manifest fetch "$PACKAGE:$VERSION" >/dev/null 2>&1; then
            echo "Package version already exists; publish a new version instead." >&2
            exit 1
          fi
          oras push "$PACKAGE:$VERSION" \
            --artifact-type application/vnd.refindone.ios.package.v1 \
            --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "org.opencontainers.image.version=$VERSION" \
            "$FILE:application/octet-stream" SHA256SUMS.txt:text/plain
          oras pull "$PACKAGE:$VERSION" --output verify-package
          (cd verify-package && sha256sum --check SHA256SUMS.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(cat VERSION)
          FLAGS=(--latest)
          if [[ "$VERSION" == *-* ]]; then FLAGS=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "ReFind One $VERSION" --notes-file CHANGELOG.md "${FLAGS[@]}" \
            "build/ReFindOne-${VERSION}-unsigned.ipa" build/SHA256SUMS.txt
