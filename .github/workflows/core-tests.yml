name: Portable core tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  swift-tests:
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite headers
        run: apt-get update && apt-get install -y libsqlite3-dev
      - name: Run tests
        run: swift test -j 2 -Xswiftc -strict-concurrency=complete
